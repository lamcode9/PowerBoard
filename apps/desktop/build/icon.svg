<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#0B1E4B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- macOS Big Sur rounded-square plate -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>

  <!-- connectors (behind cards) -->
  <path d="M556 400 C 660 400, 660 336, 702 330" stroke="#FFFFFF" stroke-width="20" fill="none" stroke-linecap="round" opacity="0.92"/>
  <path d="M556 520 C 668 520, 620 648, 676 662" stroke="#FFFFFF" stroke-width="20" fill="none" stroke-linecap="round" opacity="0.92"/>

  <!-- app-mockup artboard -->
  <g filter="url(#soft)">
    <rect x="260" y="262" width="296" height="428" rx="40" fill="#FFFFFF"/>
  </g>
  <rect x="302" y="318" width="152" height="30" rx="15" fill="#BFD3F8"/>
  <rect x="302" y="378" width="212" height="16" rx="8" fill="#DFE9FB"/>
  <rect x="302" y="410" width="176" height="16" rx="8" fill="#DFE9FB"/>
  <rect x="302" y="442" width="196" height="16" rx="8" fill="#DFE9FB"/>
  <rect x="302" y="590" width="212" height="56" rx="28" fill="url(#btn)"/>

  <!-- diagram nodes -->
  <g filter="url(#soft)">
    <circle cx="756" cy="326" r="70" fill="#FFFFFF"/>
  </g>
  <circle cx="756" cy="326" r="34" fill="#93C5FD"/>
  <g filter="url(#soft)">
    <rect x="668" y="596" width="176" height="132" rx="32" fill="#FFFFFF"/>
  </g>
  <rect x="700" y="636" width="112" height="18" rx="9" fill="#BFD3F8"/>
  <rect x="700" y="672" width="84" height="18" rx="9" fill="#DFE9FB"/>

  <!-- connector endpoints -->
  <circle cx="556" cy="400" r="16" fill="#FFFFFF"/>
  <circle cx="556" cy="520" r="16" fill="#FFFFFF"/>
</svg>
