appId: com.lamonade.powerboard
productName: PowerBoard
copyright: © 2026 Kah Mun Lam
directories:
  buildResources: build
  output: release
files:
  - main.js
  - dist/**
  - package.json
asarUnpack:
  # The rasterizer runs in a spawned child process (see rasterizer.ts), and a plain Node child
  # cannot read anything inside app.asar. So the worker *and* everything it resolves must be real
  # files on disk — the whole production dependency tree, not just sharp: sharp itself requires
  # detect-libc and semver, and unpacking sharp alone leaves the child failing to load it.
  - "**/node_modules/**"
  - "dist/rasterizeWorker.mjs"
mac:
  category: public.app-category.graphics-design
  icon: build/icon.icns
  darkModeSupport: true
  extendInfo:
    ITSAppUsesNonExemptEncryption: false
mas:
  # Explicit, not inherited: electron-builder 26.15.x stops after signing the .app unless the pkg
  # target is named, and `fastlane mac beta` uploads a .pkg — without this the lane dies on a nil path.
  target: pkg
  type: distribution
  category: public.app-category.graphics-design
  entitlements: build/entitlements.mas.plist
  entitlementsInherit: build/entitlements.mas.inherit.plist
  provisioningProfile: build/PowerBoard_MAS.provisionprofile
  hardenedRuntime: false
