<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#181824"/>
      <stop offset="1" stop-color="#0C0C12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B5BF0"/>
      <stop offset="1" stop-color="#8B5CFF"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#tile)"/>
  <rect x="0.5" y="0.5" width="511" height="511" rx="114.5" fill="none" stroke="#2A2A3A" stroke-width="1"/>

  <!-- connector: canvas node -> powered node -->
  <path d="M224 182 H366 V300" fill="none" stroke="#5757C4" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- node A: plain canvas node -->
  <rect x="92" y="126" width="132" height="112" rx="30" fill="none" stroke="#54546A" stroke-width="18"/>

  <!-- node B: powered / agent node -->
  <rect x="306" y="300" width="120" height="112" rx="30" fill="url(#accent)" filter="url(#glow)"/>
  <g transform="translate(366,356) scale(3.1) translate(-12,-12)" fill="#FFFFFF">
    <path d="M13 2 L6 13 L11 13 L10 22 L18 10 L13 10 Z"/>
  </g>
</svg>
