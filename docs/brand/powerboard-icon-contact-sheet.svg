<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 900" width="1120" height="900" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="tileA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#181824"/><stop offset="1" stop-color="#0C0C12"/></linearGradient>
    <linearGradient id="accA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5B5BF0"/><stop offset="1" stop-color="#8B5CFF"/></linearGradient>
    <filter id="glowA" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="tileB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#181824"/><stop offset="1" stop-color="#0C0C12"/></linearGradient>
    <linearGradient id="accB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5B5BF0"/><stop offset="1" stop-color="#8B5CFF"/></linearGradient>
    <filter id="glowB" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="tileC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#181824"/><stop offset="1" stop-color="#0C0C12"/></linearGradient>
    <linearGradient id="accC" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5B5BF0"/><stop offset="1" stop-color="#8B5CFF"/></linearGradient>
    <filter id="glowC" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="11" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="tileD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#181824"/><stop offset="1" stop-color="#0C0C12"/></linearGradient>
    <linearGradient id="accD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5B5BF0"/><stop offset="1" stop-color="#8B5CFF"/></linearGradient>
    <filter id="glowD" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

    <symbol id="iconA" viewBox="0 0 512 512">
      <rect width="512" height="512" rx="115" fill="url(#tileA)"/>
      <path d="M224 182 H366 V300" fill="none" stroke="#5757C4" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="92" y="126" width="132" height="112" rx="30" fill="none" stroke="#54546A" stroke-width="18"/>
      <rect x="306" y="300" width="120" height="112" rx="30" fill="url(#accA)" filter="url(#glowA)"/>
      <g transform="translate(366,356) scale(3.1) translate(-12,-12)" fill="#FFFFFF"><path d="M13 2 L6 13 L11 13 L10 22 L18 10 L13 10 Z"/></g>
    </symbol>
    <symbol id="iconB" viewBox="0 0 512 512">
      <rect width="512" height="512" rx="115" fill="url(#tileB)"/>
      <rect x="196" y="88" width="120" height="96" rx="26" fill="url(#accB)"/>
      <rect x="196" y="328" width="120" height="96" rx="26" fill="url(#accB)"/>
      <g filter="url(#glowB)"><path d="M270 176 L214 268 L252 268 L238 336 L302 240 L262 240 Z" fill="#FFFFFF"/></g>
    </symbol>
    <symbol id="iconC" viewBox="0 0 512 512">
      <rect width="512" height="512" rx="115" fill="url(#tileC)"/>
      <path d="M256 190 V250 M156 250 H356 M156 250 V300 M356 250 V300" fill="none" stroke="#5757C4" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="196" y="98" width="120" height="92" rx="26" fill="none" stroke="#54546A" stroke-width="18"/>
      <rect x="96" y="300" width="120" height="92" rx="26" fill="none" stroke="#54546A" stroke-width="18"/>
      <rect x="296" y="300" width="120" height="92" rx="26" fill="url(#accC)" filter="url(#glowC)"/>
      <g transform="translate(356,346) scale(2.7) translate(-12,-12)" fill="#FFFFFF"><path d="M13 2 L6 13 L11 13 L10 22 L18 10 L13 10 Z"/></g>
    </symbol>
    <symbol id="iconD" viewBox="0 0 512 512">
      <rect width="512" height="512" rx="115" fill="url(#tileD)"/>
      <rect x="100" y="100" width="312" height="312" rx="58" fill="none" stroke="#54546A" stroke-width="16"/>
      <circle cx="256" cy="256" r="112" fill="none" stroke="#7C4DFF" stroke-width="8" opacity="0.22"/>
      <circle cx="256" cy="256" r="74" fill="none" stroke="#7C4DFF" stroke-width="8" opacity="0.5"/>
      <circle cx="256" cy="256" r="34" fill="url(#accD)" filter="url(#glowD)"/>
    </symbol>
  </defs>

  <rect width="1120" height="900" fill="#0A0A0E"/>
  <text x="60" y="66" fill="#F2F2F7" font-size="34" font-weight="700">PowerBoard — logo candidates</text>
  <text x="60" y="98" fill="#8A8A9A" font-size="17">Direction #1: connected nodes + spark · electric indigo→violet on charcoal · 240px + 32px legibility check</text>

  <!-- Row 1 -->
  <use href="#iconA" x="120" y="150" width="240" height="240"/>
  <use href="#iconA" x="120" y="404" width="32" height="32"/>
  <text x="168" y="419" fill="#D6D6DE" font-size="17" font-weight="600">A · Canvas node → powered node</text>
  <text x="120" y="452" fill="#8A8A9A" font-size="14">Clearest read of “diagram + agents.” Safest default.</text>

  <use href="#iconB" x="640" y="150" width="240" height="240"/>
  <use href="#iconB" x="640" y="404" width="32" height="32"/>
  <text x="688" y="419" fill="#D6D6DE" font-size="17" font-weight="600">B · Bolt-as-connector</text>
  <text x="640" y="452" fill="#8A8A9A" font-size="14">Most energetic — leans hardest into “Power.”</text>

  <!-- Row 2 -->
  <use href="#iconC" x="120" y="510" width="240" height="240"/>
  <use href="#iconC" x="120" y="764" width="32" height="32"/>
  <text x="168" y="779" fill="#D6D6DE" font-size="17" font-weight="600">C · Branch flow</text>
  <text x="120" y="812" fill="#8A8A9A" font-size="14">Org-chart / process read. One powered node.</text>

  <use href="#iconD" x="640" y="510" width="240" height="240"/>
  <use href="#iconD" x="640" y="764" width="32" height="32"/>
  <text x="688" y="779" fill="#D6D6DE" font-size="17" font-weight="600">D · Board + live pulse</text>
  <text x="640" y="812" fill="#8A8A9A" font-size="14">“Watch agents work.” Calmest, most abstract.</text>
</svg>
