  <circle cx="256" cy="256" r="74" fill="none" stroke="url(#ring)" stroke-width="9" opacity="0.5"/>

  <circle cx="256" cy="256" r="58" fill="#7C4DFF" opacity="0.10"/>
  <circle cx="256" cy="256" r="46" fill="#8B6BFF" opacity="0.16"/>
