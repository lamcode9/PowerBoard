<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tile" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#1C1C2A"/>
      <stop offset="0.55" stop-color="#111119"/>
      <stop offset="1" stop-color="#08080D"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C4DFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#5B5BF0" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#5B5BF0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.08"/>
